# Nom de l'application
spring.application.name=CharityProject

# --- CONFIGURATION POSTGRESQL (DÉSACTIVÉE / COMMENTÉE) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/charity_db
# spring.datasource.username=admin
# spring.datasource.password=adminpassword
# spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONFIGURATION H2 (BASE DE DONNÉES EN MÉMOIRE) ---
# Utilisation d'une base H2 embarquée (les données sont recréées à chaque démarrage)
spring.datasource.url=jdbc:h2:mem:charitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Activation de la console web H2 pour visualiser les tables (accessible sur http://localhost:8761/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Stratégie de mise à jour automatique des tables via Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# (Optionnel avec H2, Hibernate détecte le dialecte automatiquement)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Autorise le rechargement de beans en cas de doublons
spring.main.allow-bean-definition-overriding=true

# Configuration Eureka (Serveur)

server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/