spring.application.name=gateway-source
# Port d'écoute de la Gateway (point d'entrée unique)
server.port=8888

# Connexion au serveur Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# 1. Activation de la découverte automatique des routes via Eureka
spring.cloud.gateway.discovery.locator.enabled=true

# 2. Permet d'utiliser les noms de services en minuscules dans les URLs (ex: /don-service/...)
spring.cloud.gateway.discovery.locator.lower-case-service-id=true