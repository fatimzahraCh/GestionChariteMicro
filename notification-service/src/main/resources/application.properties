server.port=8084
spring.application.name=notification-service
spring.config.import=optional:configserver:http://localhost:9999
# Configuration Mailpit (Serveur SMTP local)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Configuration RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=tp
spring.rabbitmq.password=tp123

# Désactivation temporaire de la vérification Config Server
spring.cloud.config.import-check.enabled=false

# Désactivation d'Eureka si le serveur Eureka n'est pas lancé en local (à passer à true si actif)
eureka.client.enabled=true