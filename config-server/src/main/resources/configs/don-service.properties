server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.datasource.url=jdbc:h2:mem:dondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Timeouts OpenFeign (en millisecondes)
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# Ordre des aspects Resilience4j : Retry enveloppe le Circuit Breaker
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2

# Retry pour user-service
resilience4j.retry.instances.user-service.max-attempts=3
resilience4j.retry.instances.user-service.wait-duration=500ms
resilience4j.retry.instances.user-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# Retry pour actioncharite-service
resilience4j.retry.instances.actioncharite-service.max-attempts=3
resilience4j.retry.instances.actioncharite-service.wait-duration=500ms
resilience4j.retry.instances.actioncharite-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# Circuit Breaker pour user-service
resilience4j.circuitbreaker.instances.user-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.user-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.user-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.user-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.user-service.automatic-transition-from-open-to-half-open-enabled=true

# Circuit Breaker pour actioncharite-service
resilience4j.circuitbreaker.instances.actioncharite-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.actioncharite-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.actioncharite-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.actioncharite-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.actioncharite-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.actioncharite-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.actioncharite-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.actioncharite-service.automatic-transition-from-open-to-half-open-enabled=true